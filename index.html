<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Sandro's HTML Games</title>

    <!-- AdSense verification script -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3087746799420474"
        crossorigin="anonymous"></script>

    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin: 0;
        padding: 40px;
        background: #f5f5f5;
      }

      .container {
        max-width: 700px;
        margin: auto;
        background: white;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 0 20px rgba(0,0,0,0.1);
      }

      img {
        max-width: 300px;
        margin-bottom: 20px;
      }

      h1 {
        font-size: 36px;
        margin-bottom: 10px;
      }

      p {
        font-size: 20px;
        margin-bottom: 30px;
      }

      a.button {
        display: inline-block;
        padding: 15px 25px;
        font-size: 22px;
        background: #0078ff;
        color: white;
        text-decoration: none;
        border-radius: 8px;
        transition: background 0.2s;
      }

      a.button:hover {
        background: #005fcc;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <img src="Game logo.png" alt="Game Logo">

      <h1>Welcome to my HTML Games Centre</h1>
      <p>This is the root domain for my GitHub Pages site.</p>

      <a class="button" href="https://sandromrmatos.github.io/search-and-go">
        To play the Search and Go game, click here
      </a>
    </div>
  </body>
</html>
